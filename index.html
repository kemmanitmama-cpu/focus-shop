<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOCUS SHOP - Free Fire Top Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080812;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 25px 20px;
      text-align: center;
      background: linear-gradient(135deg, #15152e, #24104d);
      border-bottom: 1px solid #5b35ff;
    }

    header h1 {
      font-size: 32px;
      color: #9d7bff;
      text-shadow: 0 0 15px #6c3cff;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .hero {
      text-align: center;
      padding: 55px 20px;
    }

    .hero h2 {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .hero span {
      color: #8d5cff;
    }

    .hero p {
      color: #aaa;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      border-radius: 30px;
      background: linear-gradient(90deg, #633cff, #a66cff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 20px #633cff;
    }

    .products {
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .card {
      background: #121222;
      border: 1px solid #30205e;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    .card h3 {
      color: #a77cff;
      margin-bottom: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      margin-top: 40px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>FOCUS SHOP</h1>
    <p>เติมเพชร Free Fire ง่ายๆ</p>
  </header>

  <section class="hero">
    <h2>เติมเพชร <span>Free Fire</span></h2>
    <p>ร้านเติมเกม FOCUS SHOP</p>
    <a href="#products" class="btn">ดูสินค้าทั้งหมด</a>
  </section>

  <section class="products" id="products">
    <h2>แพ็กเกจเพชร</h2>

    <div class="grid">

      <div class="card">
        <h3>แพ็กเกจ 1</h3>
        <div class="price">33 บาท</div>
        <a href="#" class="btn">สั่งซื้อ</a>
      </div>

      <div class="card">
        <h3>แพ็กเกจ 2</h3>
        <div class="price">65 บาท</div>
        <a href="#" class="btn">สั่งซื้อ</a>
      </div>

      <div class="card">
        <h3>แพ็กเกจ 3</h3>
        <div class="price">285 บาท</div>
        <a href="#" class="btn">สั่งซื้อ</a>
      </div>

    </div>
  </section>

  <footer>
    © 2026 FOCUS SHOP
  </footer>

</body>
</html>
